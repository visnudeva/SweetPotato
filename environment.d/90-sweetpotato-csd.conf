# Archcraft disables GTK CSD via LD_PRELOAD=libgtk-nocsd.so in /etc/environment.
# Clear it so GTK apps keep close buttons. Also prefer ~/.local/bin (sway wrapper).
# Keep a real PATH — Archcraft's /etc/environment PATH breaks glycin/bwrap (Firefox Save As).
LD_PRELOAD=
GTK_CSD=1
PATH=%HOME%/.local/bin:/usr/local/bin:/usr/bin:/bin:/usr/share/archcraft/scripts
